<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscribed | The Inside NAV</title>
<meta name="description" content="Stories about businesses, money and markets, told in plain words. By Atharva.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>html,body{margin:0}body{background:#FDFCF9}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ THE INSIDE NAV THEME v2 (Material Design 3, light) ============
   Same block goes in every post. Change colours only here.                  */
.svn{
  --md-primary:#3D5A80; --md-on-primary:#FFFFFF;
  --md-primary-container:#E4ECF7; --md-on-primary-container:#1D2F48;
  --md-tertiary:#5E9C76; --md-tertiary-container:#E3F2E8; --md-on-tertiary-container:#1E3A29;
  --md-error:#D9785B; --md-error-container:#FCE8DF; --md-on-error-container:#5A2616;
  --md-lavender:#ECE7F7; --md-on-lavender:#3A3159;
  --md-butter:#FBF3D5; --md-on-butter:#4A3D12;
  --md-rose:#F9E3E7; --md-on-rose:#5A2733;
  --md-surface:#FDFCF9; --md-surface-low:#FAF8F3; --md-surface-container:#F4F2EC; --md-surface-high:#ECE9E2;
  --md-on-surface:#23262C; --md-on-surface-variant:#5C616B;
  --md-outline:#A3A7AE; --md-outline-variant:#E3E0D8;
  --md-serif:"Newsreader", Georgia, "Times New Roman", serif;
  --md-sans:"Hanken Grotesk", "Segoe UI", Arial, sans-serif;
  --md-shape-s:8px; --md-shape-m:12px; --md-shape-l:16px; --md-shape-xl:28px;
  background:var(--md-surface); color:var(--md-on-surface);
  font-family:var(--md-serif); font-size:18px; line-height:1.75;
  -webkit-font-smoothing:antialiased; box-sizing:border-box; color-scheme:light;
}
.svn *,.svn *::before,.svn *::after{box-sizing:border-box}
.svn svg{max-width:100%;height:auto;display:block}
.svn .col{max-width:680px;margin:0 auto;padding:0 20px}

/* top app bar */
.svn .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--md-surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--md-outline-variant)}
.svn .bar .col{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px}
.svn .logo{display:flex;align-items:center;gap:10px;font-family:var(--md-serif);font-size:21px;font-weight:500;color:var(--md-on-surface);text-decoration:none}
.svn .logo img{width:30px;height:30px}

/* buttons */
.svn .btn{display:inline-flex;align-items:center;height:40px;padding:0 24px;border-radius:999px;background:var(--md-primary);color:var(--md-on-primary);font-family:var(--md-sans);font-size:14px;font-weight:500;letter-spacing:.1px;text-decoration:none;border:0;cursor:pointer}
.svn .btn.tonal{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.svn .btn.outline{background:transparent;color:var(--md-primary);border:1px solid var(--md-outline)}
.svn .btn:hover{box-shadow:0 1px 3px rgba(35,38,44,.18)}
.svn .btn:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px}

/* post header */
.svn .head{padding:56px 0 8px}
.svn h1{font-family:var(--md-serif);font-weight:400;font-size:clamp(2.5rem,7vw,3.6rem);line-height:1.1;letter-spacing:-.25px;margin:0 0 16px}
.svn .dek{font-size:1.25rem;line-height:1.5;color:var(--md-on-surface-variant);margin:0 0 28px}
.svn .byline{display:flex;align-items:center;gap:14px;font-family:var(--md-sans);font-size:14px;color:var(--md-on-surface-variant);padding:16px 0;border-top:1px solid var(--md-outline-variant);border-bottom:1px solid var(--md-outline-variant)}
.svn .avatar{width:44px;height:44px;border-radius:50%;background:var(--md-butter);color:var(--md-on-butter);display:grid;place-items:center;font-family:var(--md-serif);font-size:20px}
.svn .byline b{display:block;color:var(--md-on-surface);font-weight:500;font-size:16px}

/* story body */
.svn .story{padding:24px 0 8px}
.svn .story p{margin:0 0 1.15em}
.svn .story p.first::first-letter{font-size:3.6em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--md-primary)}
.svn h2{font-family:var(--md-serif);font-weight:500;font-size:1.75rem;line-height:1.25;margin:2.2em 0 .6em}
.svn .story strong{font-weight:500}

/* pull quote */
.svn .quote{background:var(--md-lavender);color:var(--md-on-lavender);border-radius:var(--md-shape-xl);padding:28px 30px;margin:32px 0;font-size:1.45rem;line-height:1.4}
.svn .quote small{display:block;font-family:var(--md-sans);font-size:14px;margin-top:12px;opacity:.8}

/* note cards */
.svn .note{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);border-radius:var(--md-shape-l);padding:20px 22px;margin:28px 0;font-size:1.05rem;line-height:1.6}
.svn .note .t{display:block;font-family:var(--md-sans);font-size:14px;font-weight:500;margin-bottom:4px}
.svn .note.warn{background:var(--md-error-container);color:var(--md-on-error-container)}

/* stat row */
.svn .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0}
.svn .stat{background:var(--md-butter);color:var(--md-on-butter);border-radius:var(--md-shape-m);padding:18px 20px}
.svn .stat+.stat{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.svn .stat b{display:block;font-weight:400;font-size:clamp(2rem,6vw,2.6rem);line-height:1.1}
.svn .stat span{font-family:var(--md-sans);font-size:14px;opacity:.85}

/* figure card */
.svn figure{margin:32px 0;padding:20px;border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-l);background:#FFFFFF}
.svn figcaption{font-family:var(--md-sans);font-size:14px;line-height:1.5;color:var(--md-on-surface-variant);margin-top:12px}
.svn figcaption b{display:block;font-size:16px;font-weight:500;color:var(--md-on-surface);margin-bottom:2px}
.svn svg text{font-family:var(--md-sans)}
.svn .legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.svn .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* list */
.svn .list{margin:24px 0;border-top:1px solid var(--md-outline-variant)}
.svn .list div{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--md-outline-variant)}
.svn .list i{width:40px;height:40px;border-radius:50%;background:var(--md-rose);display:grid;place-items:center;font-style:normal;font-family:var(--md-sans);font-weight:500;color:var(--md-on-rose)}
.svn .list div:nth-child(2) i{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.svn .list div:nth-child(3) i{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.svn .list div:nth-child(4) i{background:var(--md-butter);color:var(--md-on-butter)}
.svn .list b{display:block;font-family:var(--md-sans);font-weight:500;font-size:16px}
.svn .list span{font-size:16px;color:var(--md-on-surface-variant);line-height:1.5}

/* sign off, share, footer */
.svn .sign{font-size:2rem;color:var(--md-primary);margin:4px 0 0}
.svn .share{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);border-radius:var(--md-shape-xl);padding:28px;margin:48px 0 24px;text-align:center}
.svn .share h3{font-family:var(--md-serif);font-weight:400;font-size:1.5rem;line-height:1.3;margin:0 0 8px}
.svn .share p{font-family:var(--md-sans);font-size:15px;opacity:.85;margin:0 0 18px}
.svn .share .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.svn .foot{font-family:var(--md-sans);font-size:12px;line-height:1.6;color:var(--md-on-surface-variant);padding:20px 0 48px;border-top:1px solid var(--md-outline-variant)}
@media (max-width:520px){.svn{font-size:17px}.svn .quote{font-size:1.25rem;padding:22px}}
/* ========================= END OF THEME ========================= */

/* ---- reading comfort v3: larger, calmer text ---- */
.svn{font-size:20px;line-height:1.72;--md-on-surface-variant:#4C515A}
.svn .col{max-width:700px}
.svn .story p,.svn .story li{font-size:1em}
.svn .dek{font-size:1.28rem}
.svn h2{font-size:1.85rem;margin-top:2.4em}
.svn .list b{font-size:17.5px}
.svn .list span{font-size:17.5px;line-height:1.55;display:block;margin-top:2px}
.svn .list p{line-height:1.55}
.svn .note,.svn .quote{font-size:1.06rem}
.svn figcaption{font-size:15px}
.svn .stat span,.svn .spec b{font-size:16px}
.svn .aside,.svn .meta,.svn .byline{font-size:15px}
.svn .foot{font-size:13.5px}
@media (max-width:520px){.svn{font-size:18.5px}.svn h2{font-size:1.6rem}.svn .list span{font-size:16.5px}}
/* ---- type v2: Newsreader + Hanken Grotesk ---- */
.svn .stat b,.svn .cm-hero b,.svn .spec b,.svn .pe b,.svn svg text,.svn .giant{font-variant-numeric:tabular-nums lining-nums}
.svn h1,.svn h2{letter-spacing:-.01em}


.svn .wide{max-width:1080px;margin:0 auto;padding:0 20px}
.svn .mast{padding:64px 0 40px;text-align:center;border-bottom:1px solid var(--md-outline-variant)}
.svn .mast img{width:56px;height:56px;margin:0 auto 18px;display:block}
.svn .mast h1{font-size:clamp(3rem,10vw,6rem);line-height:1;letter-spacing:-1px;margin:0 0 16px}
.svn .mast p{font-size:1.25rem;line-height:1.5;color:var(--md-on-surface-variant);margin:0 auto;max-width:36ch}
.svn .today{font-family:var(--md-sans);font-size:14px;color:var(--md-on-surface-variant);padding:18px 0;text-align:center;border-bottom:1px solid var(--md-outline-variant)}

.svn .cover{border-radius:var(--md-shape-l);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;min-height:220px;position:relative;overflow:hidden}
.svn .cover b{font-family:var(--md-serif);font-weight:400;font-size:clamp(4rem,12vw,7.5rem);line-height:.85;letter-spacing:-2px}
.svn .cover span{font-family:var(--md-sans);font-size:14px;margin-top:12px;opacity:.85}
.svn .cover::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.45)}
.svn .sky{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.svn .mint{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.svn .peach{background:var(--md-error-container);color:var(--md-on-error-container)}
.svn .lavender{background:var(--md-lavender);color:var(--md-on-lavender)}
.svn .butter{background:var(--md-butter);color:var(--md-on-butter)}
.svn .rose{background:var(--md-rose);color:var(--md-on-rose)}

.svn a.story{color:inherit;text-decoration:none}
.svn a.story:focus-visible{outline:3px solid var(--md-primary);outline-offset:4px;border-radius:var(--md-shape-l)}
.svn a.story:hover h2,.svn a.story:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.svn .meta{font-family:var(--md-sans);font-size:14px;color:var(--md-on-surface-variant)}

.svn a.story.feature{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:44px 0;border-bottom:1px solid var(--md-outline-variant)}
.svn .feature .cover{min-height:380px}
.svn .feature h2{font-size:clamp(2.1rem,4.6vw,3.2rem);line-height:1.1;margin:0 0 14px;font-weight:400}
.svn .feature p{font-size:1.2rem;line-height:1.55;color:var(--md-on-surface-variant);margin:0 0 18px}

.svn .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 28px;padding:40px 0}
.svn .grid a.story{display:block}
.svn .grid .cover{min-height:200px;margin-bottom:16px}
.svn .grid .cover b{font-size:3.6rem;letter-spacing:-1px}
.svn .grid h3{font-family:var(--md-serif);font-weight:400;font-size:1.45rem;line-height:1.25;margin:0 0 8px}
.svn .grid p{margin:0 0 10px;color:var(--md-on-surface-variant);font-size:1rem;line-height:1.5}
.svn .soon{border:1px dashed var(--md-outline);border-radius:var(--md-shape-l);min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--md-sans);font-size:15px;color:var(--md-on-surface-variant)}

.svn .about{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;background:var(--md-butter);color:var(--md-on-butter);border-radius:var(--md-shape-xl);padding:32px;margin:16px 0 0}
.svn .about .avatar{width:64px;height:64px;font-size:28px;background:#FFFFFF}
.svn .about h3{font-family:var(--md-serif);font-weight:400;font-size:1.6rem;margin:0 0 6px}
.svn .about p{margin:0;line-height:1.65;max-width:60ch}

.svn .sub{background:var(--md-primary-container);color:var(--md-on-primary-container);border-radius:var(--md-shape-xl);padding:40px 32px;margin:20px 0 44px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.svn .sub h3{font-family:var(--md-serif);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.15;margin:0 0 8px}
.svn .sub p{margin:0;font-family:var(--md-sans);font-size:15px;opacity:.85}
.svn .sub form{display:flex;gap:10px;flex-wrap:wrap}
.svn .sub input[type=email]{flex:1 1 220px;height:56px;border-radius:var(--md-shape-s) var(--md-shape-s) 0 0;border:0;border-bottom:2px solid var(--md-primary);background:#FFFFFF;color:var(--md-on-surface);padding:0 16px;font-family:var(--md-sans);font-size:16px}
.svn .sub input[type=email]:focus{outline:none;border-bottom-width:3px}
.svn .sub .btn{height:56px;padding:0 28px;font-size:15px}
.svn .hp{position:absolute;left:-9999px}

@media (max-width:860px){
  .svn a.story.feature{grid-template-columns:1fr;gap:24px}
  .svn .feature .cover{min-height:260px}
  .svn .grid{grid-template-columns:1fr 1fr}
  .svn .sub{grid-template-columns:1fr}
}
@media (max-width:560px){
  .svn .grid{grid-template-columns:1fr}
  .svn .about{grid-template-columns:1fr}
}
</style>
</head>

  </div></div>
